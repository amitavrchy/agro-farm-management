services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: agro
    ports:
      - "5438:5432"
    volumes:
      - agro_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agro_pg_dev:
