services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - agro_pg:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - agro_redis:/data
    restart: unless-stopped
  api:
    build: ../backend
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  web:
    build: ../frontend
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped
volumes:
  agro_pg:
  agro_redis:
